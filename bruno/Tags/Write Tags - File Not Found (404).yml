info:
  name: Write Tags - File Not Found (404)
  type: http
  seq: 6

http:
  method: PATCH
  url: "{{baseUrl}}/api/media/tags"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "path": "{{nonExistentAudioPath}}",
        "tags": {
          "title": "Non Existent Track"
        }
      }
  auth:
    type: bearer
    token: "{{authToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return 404 when file does not exist", function() {
          expect(res.getStatus()).to.equal(404);
          expect(res.getBody().success).to.be.false;
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.body.success
      operator: eq
      value: "false"
    - expression: res.body.error.code
      operator: eq
      value: NOT_FOUND

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
