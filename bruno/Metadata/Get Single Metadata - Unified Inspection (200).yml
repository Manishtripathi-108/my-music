info:
  name: Get Single Metadata - Unified Inspection (200)
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/media/metadata?path={{sampleAudioPathFlac}}"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: path
      value: "{{sampleAudioPathFlac}}"
      type: query
  auth:
    type: bearer
    token: "{{authToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return 200 with audio metadata", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().success).to.be.true;
          expect(res.getBody().data).to.be.an('object');
          expect(res.getBody().data.filePath).to.be.a('string');
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.success
      operator: eq
      value: "true"
    - expression: res.body.data.filePath
      operator: isDefined
    - expression: res.body.data.tags
      operator: isDefined
    - expression: res.body.data.technical
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
