info:
  name: Audio Source Binary Stream (200)
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/media/artwork?path={{sampleAudioPathFlac}}"
  params:
    - name: path
      value: "{{sampleAudioPathFlac}}"
      type: query
  auth:
    type: bearer
    token: "{{authToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns extracted image binary or 404 if no embedded artwork", function() {
          expect([200, 404]).to.include(res.getStatus());
          if (res.getStatus() === 200) {
            expect(res.getHeader('content-type')).to.include('image/');
          }
        });
  assertions:
    - expression: res.status
      operator: in
      value: "[200, 404]"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
