info:
  name: Remove Artwork - Missing Path (422)
  type: http
  seq: 10

http:
  method: DELETE
  url: "{{baseUrl}}/api/media/artwork"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{authToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return 422 when path param is omitted", function() {
          expect(res.getStatus()).to.equal(422);
          expect(res.getBody().success).to.be.false;
          expect(res.getBody().error.code).to.equal("VALIDATION_ERROR");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "422"
    - expression: res.body.success
      operator: eq
      value: "false"
    - expression: res.body.error.code
      operator: eq
      value: VALIDATION_ERROR

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
