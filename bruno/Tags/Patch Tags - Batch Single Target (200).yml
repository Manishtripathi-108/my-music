info:
  name: Patch Tags - Batch Single Target (200)
  type: http
  seq: 11

http:
  method: PATCH
  url: "{{baseUrl}}/api/media/tags/batch"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "targets": [
          {
            "path": "{{sampleAudioPath}}",
            "tags": {
              "comment": "Batch PATCH Test"
            }
          }
        ],
        "preserveOriginal": false
      }
  auth:
    type: bearer
    token: "{{authToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("should batch update tags via PATCH and return 200", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().success).to.be.true;
          expect(res.getBody().data.succeeded).to.be.an('array');
          expect(res.getBody().data.succeeded[0].tags).to.be.an('object');
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.success
      operator: eq
      value: "true"
    - expression: res.body.data.total
      operator: eq
      value: "1"
    - expression: res.body.data.succeeded
      operator: isDefined
    - expression: res.body.data.succeeded[0].tags
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
