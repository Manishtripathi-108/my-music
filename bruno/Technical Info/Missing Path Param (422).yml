info:
  name: Missing Path Param (422)
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/media/technical"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{authToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("should reject missing path with 422 validation error", function() {
          expect(res.getStatus()).to.equal(422);
          expect(res.getBody().success).to.be.false;
          expect(res.getBody().error.code).to.equal('VALIDATION_ERROR');
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "422"
    - expression: res.body.success
      operator: eq
      value: "false"
    - expression: res.body.error.code
      operator: eq
      value: VALIDATION_ERROR

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
