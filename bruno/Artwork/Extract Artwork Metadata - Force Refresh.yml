info:
  name: Extract Artwork Metadata - Force Refresh
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/media/artwork"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "path": "{{sampleAudioPathFlac}}",
        "forceRefresh": true
      }
  auth:
    type: bearer
    token: "{{authToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("forces fresh extraction bypassing cache", function() {
          expect([200, 404]).to.include(res.getStatus());
        });
  assertions:
    - expression: res.status
      operator: in
      value: "[200, 404]"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
