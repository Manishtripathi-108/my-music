info:
  name: File Not Found (404)
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/media/metadata?path={{nonExistentAudioPath}}"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: path
      value: "{{nonExistentAudioPath}}"
      type: query
  auth:
    type: bearer
    token: "{{authToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return 404 for non-existent audio file", function() {
          expect(res.getStatus()).to.equal(404);
          expect(res.getBody().success).to.be.false;
          expect(res.getBody().error.code).to.equal('NOT_FOUND');
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.body.success
      operator: eq
      value: "false"
    - expression: res.body.error.code
      operator: eq
      value: NOT_FOUND

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
