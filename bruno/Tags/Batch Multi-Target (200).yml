info:
  name: Batch Multi-Target (200)
  type: http
  seq: 7

http:
  method: PATCH
  url: "{{baseUrl}}/api/media/tags/batch"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "targets": [
          {
            "path": "{{sampleAudioPath}}",
            "tags": {
              "albumArtists": ["Various Artists"],
              "compilation": true
            }
          },
          {
            "path": "{{sampleAudioPathFlac}}",
            "tags": {
              "albumArtists": ["Various Artists, The Beatles"],
              "compilation": true
            }
          }
        ],
        "preserveOriginal": false
      }
  auth:
    type: bearer
    token: "{{authToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return 200 with batch write results", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().success).to.be.true;
          expect(res.getBody().data.total).to.equal(2);
          expect(res.getBody().data.succeeded[0].tags).to.be.an('object');
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.success
      operator: eq
      value: "true"
    - expression: res.body.data.total
      operator: eq
      value: "2"
    - expression: res.body.data.succeeded
      operator: isDefined
    - expression: res.body.data.failed
      operator: isDefined
    - expression: res.body.data.succeeded[0].tags
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
