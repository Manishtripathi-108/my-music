info:
  name: Get Audio Tags - Normalized Read (200)
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/api/media/tags?path={{sampleAudioPathFlac}}"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: path
      value: "{{sampleAudioPathFlac}}"
      type: query
  auth:
    type: bearer
    token: "{{authToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("should retrieve audio tags and return 200", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().success).to.be.true;
          expect(res.getBody().data).to.be.an('object');
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.success
      operator: eq
      value: "true"
    - expression: res.body.data.title
      operator: isDefined
    - expression: res.body.data.artists
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
