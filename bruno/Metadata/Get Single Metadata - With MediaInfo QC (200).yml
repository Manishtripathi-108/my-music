info:
  name: Get Single Metadata - With MediaInfo QC (200)
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/api/media/metadata?path={{sampleAudioPathFlac}}&includeQC=true"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: path
      value: "{{sampleAudioPathFlac}}"
      type: query
    - name: includeQC
      value: "true"
      type: query
  auth:
    type: bearer
    token: "{{authToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns unified metadata including TagLib tags and MediaInfo QC", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().success).to.be.true;
          expect(res.getBody().data.tags).to.be.an('object');
          expect(res.getBody().data.technical).to.be.an('object');
          expect(res.getBody().data.qc).to.be.an('object');
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.success
      operator: eq
      value: "true"
    - expression: res.body.data.tags
      operator: isDefined
    - expression: res.body.data.technical
      operator: isDefined
    - expression: res.body.data.qc
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
