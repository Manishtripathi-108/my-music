info:
  name: Missing Path (422)
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{baseUrl}}/api/media/tags"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "path": "",
        "tags": {
          "title": "Missing Path Test"
        }
      }
  auth:
    type: bearer
    token: "{{authToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("should reject missing path with 422", function() {
          expect(res.getStatus()).to.equal(422);
          expect(res.getBody().success).to.be.false;
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "422"
    - expression: res.body.success
      operator: eq
      value: "false"
    - expression: res.body.error.code
      operator: eq
      value: VALIDATION_ERROR

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
