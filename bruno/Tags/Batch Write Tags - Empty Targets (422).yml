info:
  name: Batch Write Tags - Empty Targets (422)
  type: http
  seq: 8

http:
  method: PATCH
  url: "{{baseUrl}}/api/media/tags/batch"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "targets": []
      }
  auth:
    type: bearer
    token: "{{authToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("should reject empty targets array with 422", function() {
          expect(res.getStatus()).to.equal(422);
          expect(res.getBody().success).to.be.false;
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "422"
    - expression: res.body.success
      operator: eq
      value: "false"
    - expression: res.body.error.code
      operator: eq
      value: VALIDATION_ERROR

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
