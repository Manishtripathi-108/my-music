info:
  name: Partial Tag Mutation (200)
  type: http
  seq: 10

http:
  method: PATCH
  url: "{{baseUrl}}/api/media/tags"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "path": "{{sampleAudioPath}}",
        "tags": {
          "comment": "Production API Engineering Patch Test"
        },
        "preserveOriginal": false
      }
  auth:
    type: bearer
    token: "{{authToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("should partially update tags via PATCH and return 200", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().success).to.be.true;
          expect(res.getBody().data.filePath).to.be.a('string');
          expect(res.getBody().data.tags).to.be.an('object');
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.success
      operator: eq
      value: "true"
    - expression: res.body.data.filePath
      operator: isDefined
    - expression: res.body.data.tags
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
