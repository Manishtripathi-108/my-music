info:
  name: Get Technical Info - Audio Stream Inspection (200)
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/media/technical?path={{sampleAudioPathFlac}}"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: path
      value: "{{sampleAudioPathFlac}}"
      type: query
  auth:
    type: bearer
    token: "{{authToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return 200 with FFprobe technical specs", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().success).to.be.true;
          expect(res.getBody().data.technical.codec).to.be.a('string');
          expect(res.getBody().data.technical.sampleRate).to.be.a('number');
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.success
      operator: eq
      value: "true"
    - expression: res.body.data.technical
      operator: isDefined
    - expression: res.body.data.technical.codec
      operator: isDefined
    - expression: res.body.data.technical.sampleRate
      operator: isDefined
    - expression: res.body.data.technical.channels
      operator: isDefined
    - expression: res.body.data.technical.duration
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
