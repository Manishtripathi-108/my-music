info:
  name: Get Technical Info - With MediaInfo QC (200)
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/media/technical?path={{sampleAudioPathFlac}}&includeQC=true"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: path
      value: "{{sampleAudioPathFlac}}"
      type: query
    - name: includeQC
      value: "true"
      type: query
  auth:
    type: bearer
    token: "{{authToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns technical stream properties and forensic MediaInfo QC", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().success).to.be.true;
          expect(res.getBody().data.technical).to.be.an('object');
          expect(res.getBody().data.qc).to.be.an('object');
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.success
      operator: eq
      value: "true"
    - expression: res.body.data.technical
      operator: isDefined
    - expression: res.body.data.technical.codec
      operator: isDefined
    - expression: res.body.data.qc
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
