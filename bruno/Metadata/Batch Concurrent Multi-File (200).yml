info:
  name: Batch Concurrent Multi-File (200)
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/media/metadata/batch"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "paths": [
          "{{sampleAudioPath}}",
          "{{sampleAudioPathFlac}}"
        ]
      }
  auth:
    type: bearer
    token: "{{authToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return 200 with batch metadata results", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().success).to.be.true;
          expect(res.getBody().data.results).to.be.an('object');
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.success
      operator: eq
      value: "true"
    - expression: res.body.data.total
      operator: isDefined
    - expression: res.body.data.results
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
