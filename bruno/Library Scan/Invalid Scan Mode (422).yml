info:
  name: Invalid Scan Mode (422)
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/scan"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "directory": "E:/Music",
        "scanMode": "invalid_scan_option",
        "recursive": true
      }
  auth:
    type: bearer
    token: "{{authToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("should reject invalid scanMode with 422", function() {
          expect(res.getStatus()).to.equal(422);
          expect(res.getBody().success).to.be.false;
          expect(res.getBody().error.code).to.equal('VALIDATION_ERROR');
          expect(res.getBody().error.details[0].field).to.equal('scanMode');
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "422"
    - expression: res.body.success
      operator: eq
      value: "false"
    - expression: res.body.error.code
      operator: eq
      value: VALIDATION_ERROR
    - expression: res.body.error.details
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
