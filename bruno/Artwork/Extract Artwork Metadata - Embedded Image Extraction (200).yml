info:
  name: Extract Artwork Metadata - Embedded Image Extraction (200)
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/media/artwork"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "path": "{{sampleAudioPathFlac}}",
        "forceRefresh": false
      }
  auth:
    type: bearer
    token: "{{authToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns extracted artwork metadata or 404 if no embedded art", function() {
          expect([200, 404]).to.include(res.getStatus());
          if (res.getStatus() === 200) {
            expect(res.getBody().success).to.be.true;
            expect(res.getBody().data.cachedPath).to.be.a('string');
            expect(res.getBody().data.filename).to.be.a('string');
            expect(res.getBody().data.mimeType).to.be.a('string');
          }
        });
  assertions:
    - expression: res.status
      operator: in
      value: "[200, 404]"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
